name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: vendor/bin/phpstan analyse -c phpstan-core.neon --no-progress
      - run: composer build
      - uses: actions/upload-artifact@v4
        with:
          name: AsyncWorldEdit
          path: build/AsyncWorldEdit.phar
