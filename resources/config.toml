# Maximum work units per job; multi-pass operations can visit a block more than once.
maxBlocks = 2000000
# Global queue limit; one active edit per player.
maxJobs = 16
# Editor budget per tick in microseconds (2000 = 2 ms).
# Individual world updates and later block physics can exceed this budget.
budgetMicros = 2000
# Work units per tick, shared between jobs.
blocksPerTick = 2048
# Shared undo/redo memory limit in bytes (67108864 = 64 MiB).
historyBytes = 67108864
# Undo/redo entries per player per world.
# History is discarded on disconnect, world unload or plugin shutdown.
historyEntries = 15
# Block limit for clipboards and smoothing snapshots.
clipboardBlocks = 500000
# Schematic workers (1-4), started on demand.
workers = 1
# Shared clipboard memory in bytes, including reserved replacements.
clipboardBytes = 67108864
